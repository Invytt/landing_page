
[functions.subscribe]
enabled = true
# Public endpoint by design: the waitlist form on the marketing site POSTs here
# straight from the browser with no Authorization header (lib/waitlist.ts).
# verify_jwt = true would 401 every signup. Must deploy with --no-verify-jwt.
# Abuse control is the handler's email validation + the unique index on
# waitlist_signups.email, not auth.
verify_jwt = false
import_map = "./functions/subscribe/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/subscribe/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/subscribe/*.html" ]

[functions.send-waitlist-emails]
enabled = true
# No Supabase JWT — the worker authenticates the cron caller via the
# x-cron-secret header (CRON_SECRET). Must deploy with --no-verify-jwt.
verify_jwt = false
entrypoint = "./functions/send-waitlist-emails/index.ts"
